# Render Blueprint — https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: safelaw
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: LAW_OC
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
